plugins {
    id 'com.android.library'
    id 'com.google.protobuf'
}

android {
    compileSdk 37

    defaultConfig {
        minSdk 24

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"

        manifestPlaceholders.columbus_permission = rootProject.columbusPermission
        buildConfigField "String", "COLUMBUS_PERMISSION_NAME", "\"$rootProject.columbusPermission\""

    }

    buildTypes {
        release {
            //minify is enabled, but obfuscation is intentionally disabled in the rules
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        aidl true
        buildConfig true
    }
    namespace 'com.google.android.columbus'
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:4.36.2"
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {
                    option 'lite'
                }
            }
        }
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.19.1'

    //LiteRT (TensorFlow Lite), used in non-CHRE usage
    implementation "com.google.ai.edge.litert:litert:$litert_version"

    //Protobuf
    api "com.google.protobuf:protobuf-javalite:4.36.2"

    compileOnly project(path: ':systemstubs')
    api project(path: ':shared')

}