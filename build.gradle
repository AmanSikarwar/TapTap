// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.protobufVersion = '0.10.1'
    ext.refine_version = '4.4.0'
    ext.litert_version = '2.3.2'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.5.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.21"
        classpath "com.google.protobuf:protobuf-gradle-plugin:$protobufVersion"
        classpath "dev.rikka.tools.refine:gradle-plugin:$refine_version"
        classpath "com.google.android.gms:oss-licenses-plugin:0.13.0"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

plugins {
    id 'com.google.devtools.ksp' version '2.3.14' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.21' apply false
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}